name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: benefy_db
          POSTGRES_USER: benefy_user
          POSTGRES_PASSWORD: benefy_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benefy_user -d benefy_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Pruebas con settings de desarrollo: los de producción exigen secretos reales.
      ENVIRONMENT: development
      DEBUG: "True"
      SECRET_KEY: ci-secret-key-solo-para-pruebas-1234567890
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: benefy_db
      DB_USER: benefy_user
      DB_PASSWORD: benefy_pass
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar configuración
        run: python manage.py check
      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: python manage.py test core.tests --noinput

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Build de producción
        run: npm run build

  benef-ai:
    name: Benef AI (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benef-ai
    env:
      ENVIRONMENT: development
      BENEFY_LOAD_DOTENV: "0"
      BENEF_AI_SERVICE_TOKEN: token-de-pruebas-de-32-caracteres-xxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: benef-ai/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests -v

  tools:
    name: Herramientas y smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pruebas de herramientas
        run: python -m unittest discover -s tools/tests -v

  mobile:
    name: Móvil (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
